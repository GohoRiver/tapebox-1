<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 移动端适配：禁止缩放，保证手机端体验 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TapeBox · 去中心化财富宝箱</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===================== 顶部：钱包连接区 ===================== -->
  <header class="topbar">
    <div class="logo">
      <span class="logo-icon">💰</span>
      <span class="logo-text">TapeBox</span>
    </div>
    <div class="wallet-area">
      <!-- 未连接时显示连接按钮 -->
      <button id="connectBtn" class="btn-connect">连接钱包</button>
      <!-- 已连接时显示地址 -->
      <div id="walletInfo" class="wallet-info hidden">
        <span class="wallet-dot"></span>
        <span id="walletAddress">0x0000...0000</span>
      </div>
    </div>
  </header>

  <!-- ===================== 滚动中奖横幅 ===================== -->
  <div class="marquee-wrap">
    <div class="marquee" id="marquee">
      <!-- 内容由 JS 动态填充并循环滚动 -->
    </div>
  </div>


  <!-- ===================== 背景粒子层（金币 / 微光，填补深色留白） ===================== -->
  <div class="bg-particles" id="bgParticles"></div>

  <!-- ===================== 顶部 7 个选项（手机端可左右滑动） ===================== -->
  <nav class="box-options" id="boxOptions">
    <button class="opt-btn active" data-opt="daily1">
      <span class="opt-icon">🎁</span><span class="opt-name">青铜宝箱</span>
      <span class="opt-sub">0.05 · 24点</span>
    </button>
    <button class="opt-btn" data-opt="daily2">
      <span class="opt-icon">💎</span><span class="opt-name">白银宝箱</span>
      <span class="opt-sub">0.5 · 24点</span>
    </button>
    <button class="opt-btn" data-opt="daily3">
      <span class="opt-icon">👑</span><span class="opt-name">黄金宝箱</span>
      <span class="opt-sub">5 · 24点</span>
    </button>
    <button class="opt-btn" data-opt="main_bronze">
      <span class="opt-icon">🥉</span><span class="opt-name">Tape青铜</span>
      <span class="opt-sub">满50人开</span>
    </button>
    <button class="opt-btn" data-opt="main_silver">
      <span class="opt-icon">🥈</span><span class="opt-name">Tape白银</span>
      <span class="opt-sub">满50人开</span>
    </button>
    <button class="opt-btn" data-opt="main_diamond">
      <span class="opt-icon">🏆</span><span class="opt-name">Tape钻石</span>
      <span class="opt-sub">满50人开</span>
    </button>
    <button class="opt-btn" data-opt="free">
      <span class="opt-icon">🆓</span><span class="opt-name">Type Box</span>
      <span class="opt-sub">免费参与</span>
    </button>
  </nav>

  <!-- ===================== 中心大宝箱（主要视觉焦点） ===================== -->
  <main class="stage">
    <div class="big-chest" id="bigChest" data-theme="daily1">
      <div class="chest-glow"></div>
      <div class="chest-body">
        <div class="chest-lid"></div>
        <div class="chest-base">
          <span class="chest-emoji" id="chestEmoji">🎁</span>
        </div>
      </div>
      <div class="chest-sparkles" id="chestSparkles"></div>
    </div>

    <!-- 精简状态栏：倒计时 / 参与人数 / 奖池 -->
    <div class="mini-stats" id="miniStats">
      <div class="mini-stat">
        <span class="mini-label">倒计时 <i class="mount">mount</i></span>
        <span class="mini-value timer" id="globalTimer">--:--:--</span>
      </div>
      <div class="mini-stat">
        <span class="mini-label">参与人数 <i class="mount">mount</i></span>
        <span class="mini-value"><b class="players" id="miniPlayers">0</b> <span id="miniPlayersMax">/ 20 人</span></span>
      </div>
      <div class="mini-stat">
        <span class="mini-label">总奖池 <i class="total">Total</i></span>
        <span class="mini-value pool" id="miniPool">0.00 BEM</span>
      </div>
    </div>

    <button class="btn-detail" id="openDetailBtn">查看详情 / 参与</button>
  </main>

  <!-- ===================== 详情页（全屏 Modal） ===================== -->
  <div class="detail-overlay hidden" id="detailOverlay">
    <div class="detail-panel">
      <button class="detail-close" id="closeDetailBtn">✕</button>
      <div class="detail-head">
        <span class="detail-icon" id="detailIcon">🎁</span>
        <h2 class="detail-title" id="detailTitle">青铜宝箱</h2>
        <div class="detail-price" id="detailPrice">起投 0.05 BEM</div>
      </div>

      <p class="detail-desc" id="detailDesc"></p>

      <div class="detail-stats">
        <div class="stat">
          <span class="stat-label">倒计时 <i class="mount">mount</i></span>
          <span class="stat-value timer" data-timer="detail">--:--:--</span>
        </div>
        <div class="stat">
          <span class="stat-label">参与人数 <i class="mount">mount</i></span>
          <span class="stat-value"><b class="players" data-players="detail">0</b> <span id="detailPlayersMax">/ 20 人</span></span>
        </div>
        <div class="stat">
          <span class="stat-label">奖池 <i class="total">Total</i></span>
          <span class="stat-value pool" data-pool="detail">0.00 BEM</span>
        </div>
      </div>

      <!-- 单个投注按钮（所有宝箱统一） -->
      <div class="detail-actions" id="detailActions">
        <button class="btn-bet" id="detailBetBtn" data-bet="daily1">投入 0.05 BEM</button>
        <div class="bet-tip" id="detailBetTip" data-tip="detail"></div>
      </div>

      <!-- 打赏入口 -->
      <div class="tip-area">
        <p class="tip-fake">打赏制作者中奖概率可能更高哦(假的)</p>
        <p class="tip-note">打赏最低 0.1 BEM，上不封顶；打赏成功后下次提现手续费减免 2.5%（5% → 2.5%）</p>
        <button class="btn-tip" id="tipBtn">打赏制作者</button>
      </div>
    </div>
  </div>

  <!-- ===================== 中奖冲击弹窗 ===================== -->
  <div class="win-overlay hidden" id="winOverlay">
    <!-- 撒花容器 -->
    <div class="confetti" id="confetti"></div>
    <div class="win-card">
      <div class="win-crown">👑</div>
      <h1 class="win-title">恭喜中奖！</h1>
      <p class="win-sub">你赢得了</p>
      <div class="win-amount" id="winAmount">0.00 BEM</div>
      <p class="win-box" id="winBoxName">Type Box</p>

      <div class="win-actions">
        <button class="btn-withdraw" id="withdrawBtn">立即提现</button>
        <button class="btn-share" id="shareBtn">分享到 X</button>
      </div>

      <button class="btn-close-win" id="closeWinBtn">关闭</button>
    </div>
  </div>

  <!-- ===================== 通用提示 Toast ===================== -->
  <div class="toast hidden" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
